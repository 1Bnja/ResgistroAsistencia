server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Configuración para logs de Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extraer nombre del container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extraer ID del container
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Extraer etiquetas de compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Extraer nombre del proyecto
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

    # Pipeline para parsear logs y extraer información de seguridad
    pipeline_stages:
      # Extraer timestamp
      - timestamp:
          source: time
          format: RFC3339Nano

      # Parsear logs JSON (para servicios Node.js)
      - json:
          expressions:
            level: level
            msg: message
            method: method
            status: status
            path: path
            ip: ip
            user: user
            error: error

      # Extraer información de logs de texto
      - regex:
          expression: '(?P<method>GET|POST|PUT|DELETE|PATCH)\s+(?P<path>/[^\s]*)\s+(?P<status>\d{3})'

      # Etiquetar logs por nivel
      - labels:
          level:
          method:
          status:

      # Parsear errores de autenticación
      - match:
          selector: '{container=~"api-backend.*"}'
          stages:
            - regex:
                expression: '(ERROR|WARN).*auth|token|jwt|login|password'
            - labels:
                security_event: "auth"

      # Parsear accesos denegados
      - match:
          selector: '{status=~"40[13]"}'
          stages:
            - labels:
                security_event: "access_denied"

      # Parsear conexiones a base de datos
      - match:
          selector: '{container=~".*"} |~ "MongoDB|mysql|postgres|database"'
          stages:
            - regex:
                expression: '(connect|disconnect|error).*database'
            - labels:
                security_event: "database"

  # Configuración específica para HAProxy (API Gateway)
  - job_name: haproxy
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=api-gateway"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - regex:
          expression: '(?P<client_ip>[^\s]+)\s+[^\s]+\s+[^\s]+\s+\[(?P<timestamp>[^\]]+)\]\s+"(?P<method>[A-Z]+)\s+(?P<path>[^\s]+)\s+[^"]+"\s+(?P<status>\d{3})'
      - labels:
          client_ip:
          method:
          status:
      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'

  # Configuración para servicios de IA
  - job_name: ai-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=~ai-service.*"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            msg: message
            funcName: funcName
      - labels:
          level:
